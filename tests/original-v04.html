<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1525"><title>SPARK Simple+</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f4f7ff;font:15px system-ui,-apple-system,'Segoe UI',sans-serif;background:radial-gradient(circle at 40% -12%,#2a4660,#101b2d 48%,#0b1423)}button{cursor:pointer;touch-action:manipulation;font:inherit}button:disabled{opacity:.38;cursor:not-allowed}.shell{max-width:750px;margin:auto;padding:16px 12px 46px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}.logo{font-weight:950;font-size:27px;letter-spacing:.04em}.logo span{color:#62ead0}.small{font-size:12px;color:#9eadc7}.panel{background:#17253be8;border:1px solid #334460;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 9px 30px #050b1833}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pill{border:1px solid #536c82;color:#b7efe1;border-radius:99px;padding:6px 10px;font-size:12px}.scores{display:flex;gap:8px;margin-top:14px}.score{flex:1;text-align:center;border-radius:14px;background:#101e30;border:1px solid #3b5168;padding:10px}.score.you{background:#153e39;border-color:#4cd4b4}.score b{display:block;font-size:28px;margin-top:2px}.score small{font-size:12px;color:#a8c2ce}.board{direction:ltr;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:14px 0 6px}.card{border:1px solid #ffffff52;border-radius:11px;min-width:0;aspect-ratio:.73;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:25px;font-weight:900;color:white;box-shadow:inset 0 1px #ffffff45,0 5px 10px #0004}.card small{font-size:9px;opacity:.78;margin-top:3px}.cO{background:linear-gradient(140deg,#ffac57,#d65339)}.cB{background:linear-gradient(140deg,#5edbe0,#1e7cad)}.cP{background:linear-gradient(140deg,#bc91ff,#7253d0)}.cW{background:linear-gradient(140deg,#eccb78,#bb743f)}.cS{background:linear-gradient(140deg,#8095aa,#3d546f)}.gaps{direction:ltr;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}.gap{min-width:0;border-radius:9px;border:1px dashed #61cbb5;background:#194b43;color:#d5ffed;padding:11px 0;font-weight:800}.gap:hover{background:#236957}.hand{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}.hand .card{width:76px;aspect-ratio:.73;transition:transform .15s}.hand .card.chosen{outline:3px solid #f8e4a2;outline-offset:3px;transform:translateY(-5px)}.specials{display:flex;justify-content:center;gap:10px;margin-top:12px}.special{background:#223852;border:1px solid #526983;border-radius:12px;color:#fff;padding:10px 16px;min-width:125px}.special.chosen{outline:2px solid #67e8c0;background:#21564d}.message{background:#214339;border:1px solid #438b71;padding:13px;border-radius:13px;line-height:1.65;min-height:60px;margin-top:10px;color:#dcffec}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #50647e;color:#fff;background:#253751;border-radius:10px;padding:10px 13px}.primary{background:#63e2bf;color:#082d2c;border:0;font-weight:800}.swaps{direction:ltr;display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:12px}.swaps button{border:1px dashed #76cfc4;background:#215249;color:#fff;border-radius:9px;padding:12px 0;font-size:12px}.colors{display:flex;justify-content:center;gap:9px;margin:10px 0}.colors button{border-radius:12px;padding:8px 14px;background:#20354a;border:1px solid #55718b;color:#fff}.colors button.chosen{border:2px solid #ffe3a0}h1,h2,p{margin:0}h2{font-size:15px;margin-bottom:9px}p{line-height:1.6}.rule{font-size:12px;color:#bfcce2;line-height:1.7}.win{font-size:19px;font-weight:800;color:#80efce;margin:11px 0}.tag{display:inline-block;border-radius:7px;background:#28455b;padding:5px 9px;color:#beffea;font-size:11px}.log{font-size:12px;color:#b6c8dc;line-height:1.7}.log div{padding:5px 0;border-bottom:1px solid #ffffff18}.footer{font-size:11px;color:#879ab5;text-align:center;margin-top:20px}@media(max-width:400px){.shell{padding:10px 7px}.panel{padding:10px;border-radius:14px}.card{font-size:20px}.board{gap:3px}.hand .card{width:65px}.special{min-width:0;flex:1;padding:9px 5px}}
</style></head><body><div class="shell"><div class="top"><div><div class="logo">⚡ SPARK <span>SIMPLE+</span></div><div class="small">Match • Chain • Outsmart</div></div><button class="btn" id="language">English</button></div><main id="app"></main><div class="footer">Prototype v0.4 · Offline playable · Not commercially validated</div></div>
<script>
(()=>{'use strict';
const KEY='spark-simple-v04',types=['O','B','P'],symbols={O:'✦',B:'◆',P:'⬡',W:'★',S:'⇄'},names={O:['כתום','Orange'],B:['כחול','Blue'],P:['סגול','Purple']};
let lang='he',game=null,choice={kind:'hand',index:0,color:'P'},rulesOpen=false;
function t(he,en){return lang==='he'?he:en}
function makeDeck(){let d=[];for(let i=0;i<100;i++)d.push(types[i%3]);for(let i=d.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}return d;}
function draw(d){if(!d.length)d.push(...makeDeck());return d.pop();}
function start(bots=1){const deck=makeDeck();const board=['B','P','P','O','B','O','B'];const hands=[['P','O','B']];for(let i=0;i<bots;i++)hands.push([draw(deck),draw(deck),draw(deck)]);game={version:4,deck,board,players:hands.map((hand,i)=>({name:i===0?'YOU':'BOT '+i,hand,points:0,wild:1,swap:1})),bots,round:0,over:false,log:[],note:t('בחר את הסגול מהיד והכנס אותו ברווח שלפני הכתום.','Start with Purple and insert it just before the Orange card.'),first:true};choice={kind:'hand',index:0,color:'P'};save();render();}
function copy(x){return JSON.parse(JSON.stringify(x));}
function compute(board){let b=board.slice(),score=0,waves=0;for(let k=0;k<8;k++){const remove=new Set();for(let i=0;i<b.length;){let j=i+1;while(j<b.length&&b[j]===b[i])j++;if(j-i>=3)for(let z=i;z<j;z++)remove.add(z);i=j;}if(!remove.size)break;waves++;score+=remove.size;b=b.filter((_,i)=>!remove.has(i));}return{board:b,score,waves};}
function fill(board,deck){let b=board.slice(0,7);while(b.length<7){let idx=deck.findLastIndex(c=>!(b.length>=2&&b.at(-1)===c&&b.at(-2)===c));if(idx===-1){deck.push(...makeDeck());idx=deck.findLastIndex(c=>!(b.length>=2&&b.at(-1)===c&&b.at(-2)===c));}b.push(deck.splice(idx,1)[0]);}return b;}
function moveBoard(board,move){let b=board.slice();if(move.kind==='swap'){let i=move.pos;[b[i],b[i+1]]=[b[i+1],b[i]];}else b.splice(move.pos,0,move.color);return compute(b);}
function apply(index,move){const p=game.players[index];if(move.kind==='wild'){if(!p.wild)return null;p.wild--;}else if(move.kind==='swap'){if(!p.swap)return null;p.swap--;}else{p.hand.splice(move.index,1);p.hand.push(draw(game.deck));}let x=moveBoard(game.board,move);p.points+=x.score;game.board=fill(x.board,game.deck);return{score:x.score,waves:x.waves,kind:move.kind,color:move.color};}
function botMove(index){const p=game.players[index],opts=[];for(let i=0;i<p.hand.length;i++)for(let pos=0;pos<=7;pos++)opts.push({kind:'hand',index:i,color:p.hand[i],pos});if(p.wild)for(const color of types)for(let pos=0;pos<=7;pos++)opts.push({kind:'wild',color,pos});if(p.swap)for(let pos=0;pos<6;pos++)opts.push({kind:'swap',pos});for(const m of opts){const r=moveBoard(game.board,m);m.value=r.score+(r.waves>1?.4:0)+(m.kind!=='hand'?-0.3:0)+Math.random()*.9;}opts.sort((a,b)=>b.value-a.value);const chosen=opts[Math.random()<.83?0:Math.floor(Math.random()*Math.min(5,opts.length))];return apply(index,chosen);}
function finishPlayer(move){if(game.over)return;const player=game.players[0];if((move.kind==='wild'&&!player.wild)||(move.kind==='swap'&&!player.swap))return;const h=apply(0,move);let notes=[t('אתה','You')+': +'+h.score+(h.waves>1?t(' · תגובת שרשרת!',' · Chain reaction!'):'')];for(let i=1;i<game.players.length;i++){const r=botMove(i);notes.push(game.players[i].name+': +'+r.score+(r.waves>1?t(' · שרשרת',' · Chain'):''));}game.round++;game.first=false;game.over=game.round>=8;game.note=notes.join('  |  ');game.log.unshift({turn:game.round,notes:notes.slice(),scores:game.players.map(p=>p.points)});choice={kind:'hand',index:0,color:player.hand[0]};save();render();}
function save(){try{localStorage.setItem(KEY,JSON.stringify({game,lang}));}catch(e){}}
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw.game.version===4){game=raw.game;lang=raw.lang;choice={kind:'hand',index:0,color:game.players[0].hand[0]};return true;}}catch(e){}return false;}
const card=(c,i=null,active=false)=>`<button class="card c${c} ${active?'chosen':''}" ${i===null?'disabled':`data-hand="${i}"`} aria-label="${c}">${symbols[c]}<small>${t(names[c][0],names[c][1])}</small></button>`;
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';document.getElementById('language').textContent=lang==='he'?'English':'עברית';const you=game.players[0];let html=`<div class="panel"><div class="bar"><b>${t('המשחק שלך','Your game')}</b><span class="pill">${t('סיבוב','Round')} ${Math.min(8,game.round+1)} / 8</span></div><div class="scores">${game.players.map((p,i)=>`<div class="score ${i===0?'you':''}"><small>${i===0?t('אתה','You'):p.name}</small><b>${p.points}</b></div>`).join('')}</div></div><div class="panel"><div class="bar"><b>${t('השורה המשותפת','Shared row')}</b><span class="tag">7 ${t('קלפים','cards')}</span></div><div class="board">${game.board.map(c=>card(c)).join('')}</div>${!game.over&&choice.kind!=='swap'?`<div class="gaps">${Array.from({length:8},(_,i)=>`<button class="gap" data-gap="${i}" aria-label="${t('הוסף במקום','Insert at')} ${i+1}">+</button>`).join('')}</div><p class="small" style="margin-top:8px">${t('לחץ על + כדי להניח את הקלף הנבחר','Tap + to insert the selected card')}</p>`:''}${!game.over&&choice.kind==='swap'?`<p class="small" style="margin:10px 0">${t('בחר זוג קלפים סמוכים להחלפה','Choose an adjacent pair to swap')}</p><div class="swaps">${Array.from({length:6},(_,i)=>`<button data-swap="${i}">${i+1}⇄${i+2}</button>`).join('')}</div>`:''}</div>`;
if(!game.over){html+=`<div class="panel"><h2>${t('1. בחר קלף','1. Choose a card')}</h2><div class="hand">${you.hand.map((c,i)=>card(c,i,choice.kind==='hand'&&choice.index===i)).join('')}</div><div class="specials"><button class="special ${choice.kind==='wild'?'chosen':''}" data-special="wild" ${you.wild?'':'disabled'}>🌈 ${t('ג׳וקר','Wild')} ×${you.wild}</button><button class="special ${choice.kind==='swap'?'chosen':''}" data-special="swap" ${you.swap?'':'disabled'}>⇄ ${t('החלפה','Swap')} ×${you.swap}</button></div>${choice.kind==='wild'?`<div class="colors">${types.map(c=>`<button class="${choice.color===c?'chosen':''}" data-color="${c}">${symbols[c]} ${t(names[c][0],names[c][1])}</button>`).join('')}</div>`:''}<p class="small" style="text-align:center;margin-top:13px">${choice.kind==='swap'?t('החלף שני קלפים בשורה','Swap two neighboring cards'):t('2. בחר רווח בשורה למעלה','2. Choose a gap in the row above')}</p></div>`;}
html+=`<div class="panel"><h2>${t('מה קרה?','What happened?')}</h2><div class="message" role="status">${game.note}</div>${game.over?`<div class="win">${game.players[0].points===Math.max(...game.players.map(p=>p.points))?t('כל הכבוד! 🎉','You won! 🎉'):t('הבוט ניצח הפעם','Bot won this time')}</div>`:''}<div class="actions"><button class="btn primary" id="new">↻ ${t('משחק חדש','New game')}</button><button class="btn" id="rules">ⓘ ${t('חוקים','Rules')}</button><button class="btn" id="export">↓ JSON</button><button class="btn" id="bots">${game.bots===1?t('2 שחקנים','2 players'):t('3 שחקנים','3 players')} ⇄</button></div></div>`;
if(rulesOpen)html+=`<div class="panel rule"><h2>${t('איך משחקים?','How to play?')}</h2><p>${t('בכל תור בחר קלף מהיד והכנס אותו ברווח בשורה. שלושה קלפים מאותו צבע ברצף מתפוצצים ונאספים כנקודות. אחרי ההסרה, קלפים מתקרבים זה לזה, ויכולה להיווצר עוד שלישייה. כל קלף שנאסף שווה נקודה.','Choose a hand card and insert it in a gap. Runs of 3 or more matching cards explode and earn one point per card. Remaining cards slide together and may create more matches.')}</p><p>${t('לכל שחקן ג׳וקר אחד והחלפה אחת לכל המשחק. ג׳וקר הוא כל צבע שתבחר; החלפה מחליפה קלפים סמוכים ומהווה תור בפני עצמה. אם לא נוצר פיצוץ, הקלף הימני יוצא מהשורה. בסוף כל תור משלימים לשבעה קלפים. מי שצובר הכי הרבה נקודות אחרי שמונה תורות לכל שחקן מנצח.','Each player gets one Wild card and one Swap card per game. Wild becomes any color. Swap exchanges adjacent cards and uses a turn. Without a match, the rightmost card drops out. Refill to 7 cards after each turn. Highest score after eight turns per player wins.')}</p></div>`;
html+=`<div class="panel"><h2>${t('סיבובים קודמים','Recent rounds')}</h2><div class="log">${game.log.slice(0,3).map(x=>`<div>${x.turn}. ${x.notes.join(' | ')}</div>`).join('')||t('עוד לא שיחקת','No moves yet')}</div></div>`;document.getElementById('app').innerHTML=html;for(const el of document.querySelectorAll('[data-hand]'))el.onclick=()=>{choice={kind:'hand',index:+el.dataset.hand,color:you.hand[+el.dataset.hand]};render()};for(const el of document.querySelectorAll('[data-special]'))el.onclick=()=>{choice={kind:el.dataset.special,index:0,color:'P'};render()};for(const el of document.querySelectorAll('[data-color]'))el.onclick=()=>{choice.color=el.dataset.color;render()};for(const el of document.querySelectorAll('[data-gap]'))el.onclick=()=>{const move=choice.kind==='wild'?{kind:'wild',color:choice.color,pos:+el.dataset.gap}:{kind:'hand',index:choice.index,color:you.hand[choice.index],pos:+el.dataset.gap};finishPlayer(move)};for(const el of document.querySelectorAll('[data-swap]'))el.onclick=()=>finishPlayer({kind:'swap',pos:+el.dataset.swap});document.getElementById('new').onclick=()=>start(game.bots);document.getElementById('bots').onclick=()=>start(game.bots===1?2:1);document.getElementById('rules').onclick=()=>{rulesOpen=!rulesOpen;render()};document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify({game:'SPARK Simple+',exported:new Date().toISOString(),rounds:game.log,players:game.players},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='spark-simple-playtest.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
}
document.getElementById('language').onclick=()=>{lang=lang==='he'?'en':'he';save();render()};if(load())render();else start(1);
})();
</script></body></html>
