</style><link rel="stylesheet" href="online.css"></head><body><div class="shell"><header><div><div class="brand">⚡ SPARK <span>SIMPLE+</span></div><div class="subtitle">PLAYTEST STUDIO</div></div><button class="language" id="language">English</button></header><main id="app"></main></div><script src="engine-v5.js"></script><script>
(()=>{'use strict';
const KEY='spark-simple-v04',types=['O','B','P'],symbols={O:'✦',B:'◆',P:'⬡',W:'★',S:'⇄',X:'⇆'},names={X:['SHIFT','SHIFT'],O:['כתום','Orange'],B:['כחול','Blue'],P:['סגול','Purple']};
let lang='he',game=null,choice={kind:'hand',index:0,color:'P'},rulesOpen=false;
function t(he,en){return lang==='he'?he:en}
function makeDeck(){let d=[];for(let i=0;i<100;i++)d.push(types[i%3]);for(let i=d.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}return d;}
function draw(d){if(!d.length)d.push(...makeDeck());return d.pop();}
function startBase(bots=1){const deck=makeDeck();const board=['B','P','P','O','B','O','B'];const hands=[['P','O','B']];for(let i=0;i<bots;i++)hands.push([draw(deck),draw(deck),draw(deck)]);game={version:4,deck,board,players:hands.map((hand,i)=>({name:i===0?'YOU':'BOT '+i,hand,points:0,wild:1,swap:1})),bots,round:0,over:false,log:[],note:t('בחר את הסגול מהיד והכנס אותו ברווח שלפני הכתום.','Start with Purple and insert it just before the Orange card.'),first:true};choice={kind:'hand',index:0,color:'P'};save();render();}
function copy(x){return JSON.parse(JSON.stringify(x));}
function compute(board){let b=board.slice(),score=0,waves=0,frames=[];for(let k=0;k<8;k++){const remove=new Set();for(let i=0;i<b.length;){let j=i+1;while(j<b.length&&b[j]===b[i])j++;if(j-i>=3)for(let z=i;z<j;z++)remove.add(z);i=j;}if(!remove.size)break;waves++;frames.push(b.filter((_,i)=>remove.has(i)));score+=remove.size;b=b.filter((_,i)=>!remove.has(i));}return{board:b,score,waves,frames};}
function fill(board,deck){let b=board.slice(0,7);while(b.length<7){let idx=deck.findLastIndex(c=>!(b.length>=2&&b.at(-1)===c&&b.at(-2)===c));if(idx===-1){deck.push(...makeDeck());idx=deck.findLastIndex(c=>!(b.length>=2&&b.at(-1)===c&&b.at(-2)===c));}b.push(deck.splice(idx,1)[0]);}return b;}
function moveBoard(board,move){if(game?.version===5)return SparkEngine.resolve(board,move,game.mode==='C');let b=board.slice();if(move.kind==='swap'){let i=move.pos;[b[i],b[i+1]]=[b[i+1],b[i]];}else b.splice(move.pos,0,move.color);return compute(b);}
function apply(index,move){if(game?.version===5)return SparkEngine.act(game,index,move,game.pending?.opportunity);const p=game.players[index];if(move.kind==='wild'){if(!p.wild)return null;p.wild--;}else if(move.kind==='swap'){if(!p.swap)return null;p.swap--;}else{p.hand.splice(move.index,1);p.hand.push(draw(game.deck));}let x=moveBoard(game.board,move);p.points+=x.score;game.board=fill(x.board,game.deck);return{score:x.score,waves:x.waves,kind:move.kind,color:move.color,pos:move.pos,frames:x.frames};}
function chooseBotMove(index){if(game?.version===5)return SparkEngine.choose(game,index);const p=game.players[index],opts=[];for(let i=0;i<p.hand.length;i++)for(let pos=0;pos<=7;pos++)opts.push({kind:'hand',index:i,color:p.hand[i],pos});if(p.wild)for(const color of types)for(let pos=0;pos<=7;pos++)opts.push({kind:'wild',color,pos});if(p.swap)for(let pos=0;pos<6;pos++)opts.push({kind:'swap',pos});for(const m of opts){const r=moveBoard(game.board,m);m.value=r.score+(r.waves>1?.4:0)+(m.kind!=='hand'?-0.3:0)+Math.random()*.9;}opts.sort((a,b)=>b.value-a.value);const chosen=opts[Math.random()<.83?0:Math.floor(Math.random()*Math.min(5,opts.length))];return chosen;}
function botMove(index){return apply(index,chooseBotMove(index));}
function finishPlayer(move){if(game.over)return;const player=game.players[0];if((move.kind==='wild'&&!player.wild)||(move.kind==='swap'&&!player.swap))return;const h=apply(0,move);game.lastMoves=[{player:0,...h}];let notes=[t('אתה','You')+': +'+h.score+(h.waves>1?t(' · תגובת שרשרת!',' · Chain reaction!'):'')];for(let i=1;i<game.players.length;i++){const r=botMove(i);game.lastMoves.push({player:i,...r});notes.push(game.players[i].name+': +'+r.score+(r.waves>1?t(' · שרשרת',' · Chain'):''));}game.round++;game.first=false;game.over=game.round>=8;game.note=notes.join('  |  ');game.log.unshift({turn:game.round,notes:notes.slice(),moves:copy(game.lastMoves),scores:game.players.map(p=>p.points)});choice={kind:'hand',index:0,color:player.hand[0]};save();render();}
function save(){try{localStorage.setItem(KEY,JSON.stringify({game,lang}));}catch(e){}}
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY));if([4,5].includes(raw.game.version)){game=raw.game;lang=raw.lang;choice={kind:'hand',index:0,color:game.players[0].hand[0]};return true;}}catch(e){}return false;}
const card=(c,i=null,active=false)=>`<button data-symbol="${symbols[c]}" class="card c${c} ${active?'chosen':''}" ${i===null?'disabled':`data-hand="${i}"`} aria-label="${t(names[c][0],names[c][1])}">${symbols[c]}<small>${t(names[c][0],names[c][1])}</small></button>`;
function moveText(m){return (m.player===0?t('אתה','You'):game.players[m.player].name)+': +'+m.score+(m.waves>1?t(' · תגובת שרשרת!',' · Chain reaction!'):'')}
function outcome(){const best=Math.max(...game.players.map(p=>p.points)),winners=game.players.map((p,i)=>p.points===best?i:-1).filter(i=>i>=0);return winners.length>1?t('תיקו! 🤝','Tie! 🤝'):winners[0]===0?t('כל הכבוד! ניצחת 🎉','You won! 🎉'):game.players[winners[0]].name+t(' ניצח הפעם',' wins this time')}
let screen='play',slot=null,replay=null,reviewGame=null,notice='',help=false,archiveCounter=0;
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const who=i=>i===0?t('אתה','You'):'BOT '+i;
const colorName=c=>names[c]?t(...names[c]):'';
const ruleVersion='Simple+ 0.4';
function archives(){try{const x=JSON.parse(localStorage.getItem('spark-studio-sessions')||'[]');return Array.isArray(x)?x:[]}catch{return []}}
function archive(){if(!game||(!game.round&&!game.pending))return;try{let a=archives().filter(x=>x.id!==game.id);a.unshift(copy(game));localStorage.setItem('spark-studio-sessions',JSON.stringify(a.slice(0,20)));}catch{notice=t('לא ניתן לשמור את הארכיון בדפדפן. אפשר לייצא JSON.','Browser archive could not be saved. Export JSON to keep a copy.')}}
function legacyStart(bots=1){archive();startBase(bots);game.id=Date.now()+'-'+(++archiveCounter);game.rules=ruleVersion;game.uiVersion='0.6';game.phase='human';game.currentMoves=[];game.feedback='';game.createdAt=new Date().toISOString();slot=null;replay=null;reviewGame=null;screen='play';playbackPaused=false;save();render();if(typeof window!=='undefined')window.scrollTo({top:0,behavior:'auto'})}
function trace(board,move){if(game?.version===5)return SparkEngine.preview({...game,board},move).steps;let b=board.slice();if(move.kind==='swap'){[b[move.pos],b[move.pos+1]]=[b[move.pos+1],b[move.pos]]}else b.splice(move.pos,0,move.color);const steps=[{kind:'placed',board:b.slice(),removed:[],points:0}];for(let n=0;n<8;n++){const indices=[];for(let i=0;i<b.length;){let j=i+1;while(j<b.length&&b[j]===b[i])j++;if(j-i>=3)for(let z=i;z<j;z++)indices.push(z);i=j}if(!indices.length)break;steps.push({kind:'match',board:b.slice(),removed:indices.slice(),points:indices.length,wave:steps.filter(x=>x.kind==='match').length+1});b=b.filter((_,i)=>!indices.includes(i));steps.push({kind:'collapse',board:b.slice(),removed:[],points:indices.length,wave:steps.filter(x=>x.kind==='match').length})}return steps}
function legacyQueueMove(player,move){if(game.over||game.pending)return false;if(player===0&&game.phase!=='human')return false;if(player>0&&(game.phase!=='between'||game.nextPlayer!==player))return false;const p=game.players[player];if(!Number.isInteger(move.pos)||move.pos<0||move.pos>(move.kind==='swap'?5:7))return false;if(move.kind==='hand'&&(!Number.isInteger(move.index)||p.hand[move.index]!==move.color))return false;if(move.kind==='wild'&&(!p.wild||!types.includes(move.color)))return false;if(move.kind==='swap'&&!p.swap)return false;if(!['hand','wild','swap'].includes(move.kind))return false;game.pending={player,move:copy(move),before:game.board.slice(),steps:trace(game.board,move),cursor:0};game.phase='resolve';slot=null;save();render();return true}
function advance(){if(game.over)return;if(game.phase==='between'){const i=game.nextPlayer;queueMove(i,chooseBotMove(i));return}if(game.phase==='roundEnd'){game.phase='human';game.currentMoves=[];slot=null;plannedSwap=null;delete game.draft;save();render();return}const pending=game.pending;if(!pending)return;if(pending.cursor<pending.steps.length-1){pending.cursor++;save();render();return}const result=apply(pending.player,pending.move);const record={mode:game.mode||'L',rowSize:game.rowSize||7,player:pending.player,...result,scoreBefore:game.players[pending.player].points-result.score,move:pending.move,before:pending.before,steps:pending.steps,after:game.board.slice()};game.currentMoves??=[];game.currentMoves.push(record);game.lastMoves=copy(game.currentMoves);delete game.pending;game.first=false;if(pending.player<game.players.length-1){game.phase='between';game.nextPlayer=pending.player+1}else{game.round++;game.over=game.round>=8;game.phase=game.over?'over':'roundEnd';game.log.unshift({turn:game.round,moves:copy(game.currentMoves),notes:game.currentMoves.map(moveText),scores:game.players.map(p=>p.points)});if(game.over){game.completedAt=new Date().toISOString();archive()}}choice={kind:'hand',index:0,color:game.players[0].hand[0]};save();render()}
function exportSession(){archive();const payload={format:'spark-playtest',formatVersion:1,rules:rulesLabel(),uiVersion:'0.7',exportedAt:new Date().toISOString(),game:copy(game),sessions:archives()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='spark-playtest-'+(game.id||'session')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);notice=t('קובץ הבדיקה יוצא, כולל היסטוריה, ניקוד והערות.','Exported the playtest with history, scores and notes.');render()}
function physicalCard(c,{hand=null,selected=false,hit=false,dim=false,leaving=false}={}){return `<${hand===null?'div':'button'} class="card c${c} ${selected?'chosen':''} ${hit?'hit':''} ${dim?'dim':''} ${leaving?'leaving':''}" ${hand===null?'':`data-hand="${hand}" aria-pressed="${selected}"`} aria-label="${colorName(c)}"><span class="corner">${symbols[c]}</span><strong>${symbols[c]}</strong><small>${colorName(c)}</small><span class="corner bottom">${symbols[c]}</span></${hand===null?'div':'button'}>`}

function enablePhysicalDrag(){if(!game||game.phase!=='human'||screen!=='play'||replay)return;for(const el of document.querySelectorAll('.hand [data-hand]')){let drag=null,suppress=false;const originalClick=el.onclick;el.onclick=e=>{if(suppress){suppress=false;return}originalClick?.(e)};el.onpointerdown=e=>{if(e.button!==0||motionBusy)return;drag={pointer:e.pointerId,x:e.clientX,y:e.clientY,index:+el.dataset.hand,rect:readRect(el),ghost:null,pos:null};el.setPointerCapture?.(e.pointerId)};el.onpointermove=e=>{if(!drag||drag.pointer!==e.pointerId)return;if(!drag.ghost&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<9)return;e.preventDefault();if(!drag.ghost){const ghost=document.createElement('div');ghost.className='drag-card';ghost.setAttribute('aria-hidden','true');ghost.innerHTML=el.outerHTML;Object.assign(ghost.style,{width:drag.rect.width+'px',height:drag.rect.height+'px'});document.body.appendChild(ghost);drag.ghost=ghost;el.style.opacity='.18';suppress=true}Object.assign(drag.ghost.style,{left:e.clientX-drag.rect.width/2+'px',top:e.clientY-drag.rect.height*.55+'px'});const zone=readRect(document.querySelector('.row-zone'));drag.pos=null;const gaps=[...document.querySelectorAll('[data-slot]')];gaps.forEach(g=>g.classList.remove('drop-target'));if(zone&&e.clientY>zone.top-25&&e.clientY<zone.top+zone.height+35&&e.clientX>zone.left-15&&e.clientX<zone.left+zone.width+15){let best=Infinity;gaps.forEach(g=>{const r=readRect(g),d=Math.abs(e.clientX-r.left-r.width/2);if(d<best){best=d;drag.pos=+g.dataset.slot}});gaps.find(g=>+g.dataset.slot===drag.pos)?.classList.add('drop-target')}};const finish=e=>{if(!drag||drag.pointer!==e.pointerId)return;const d=drag;drag=null;el.style.opacity='';d.ghost?.remove();document.querySelectorAll('.drop-target').forEach(g=>g.classList.remove('drop-target'));if(d.ghost&&d.pos!==null){choice={kind:'hand',index:d.index,color:game.players[0].hand[d.index]};queueMove(0,{kind:'hand',index:d.index,color:choice.color,pos:d.pos,...(game.version===5 function render(){if(typeof document.querySelector!=='function'){renderBase();return}const old=snapshot(lastVisual);stopClock();const epoch=++motionEpoch;for(const a of activeAnimations)a.cancel();activeAnimations=[];document.querySelectorAll('.flying-card,.floating-points').forEach(el=>el.remove());motionBusy=false;renderBase();if(screen==='friends'){lastVisual=null;window.SparkOnline?.mount(lang);return}enablePhysicalDrag();bindExtendedControls();const meta=visualState(),fresh=snapshot(meta);lastVisual=meta;const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};bind('auto-mode',()=>{playbackAuto=!playbackAuto;playbackPaused=false;saveMotionPrefs();render()});bind('pause-motion',()=>{playbackPaused=!playbackPaused;stopClock();activeAnimations.forEach(a=>{if(a.playState==='running'&&playbackPaused)a.pause();else if(a.playState==='paused'&&!playbackPaused)a.play()});const el=document.getElementById('pause-motion');if(el)el.textContent=playbackPaused?'▶ '+t('המשך','Resume'):'Ⅱ '+t('השהה','Pause');if(!playbackPaused)schedulePlayback()});bind('motion-step',()=>{playbackPaused=true;stopClock();for(const a of activeAnimations)a.finish();motionBusy=false;playbackAdvance()});bind('advance',()=>{if(!motionBusy)playbackAdvance()});bind('motion-rate',()=>{playbackRate=playbackRate===.65?1:playbackRate===1?1.5:.65;saveMotionPrefs();render()});bind('close-replay',()=>{replay=null;playbackPaused=true;render()});bind('replay-last',()=>startReplay(game.lastMoves?.at(-1)));for(const el of document.querySelectorAll('[data-replay]'))el.onclick=()=>{const [ri,mi]=el.dataset.replay.split(':').map(Number);startReplay((reviewGame||game).log[ri]?.moves[mi],(reviewGame||game).players,reviewGame||game)};if(!old||old.meta.key!==meta.key){motionBusy=true;const advanceButton=document.getElementById('advance');if(advanceButton)advanceButton.disabled=true;animateTransition(old,fresh).catch(()=>{viewError=t('התנועה לא הושלמה. המהלך שמור; אפשר להתקדם צעד.','The animation did not finish. The move is saved; use Step to continue.')}).finally(()=>{if(epoch!==motionEpoch)return;motionBusy=false;const button=document.getElementById('advance');if(button)button.disabled=false;schedulePlayback()})}else schedulePlayback()}
if(typeof document.addEventListener==='function')document.addEventListener('visibilitychange',()=>{if(document.hidden){stopClock();playbackPaused=true;activeAnimations.forEach(a=>{if(a.playState==='running')a.pause()})}else render()});

let selectedMode='B',selectedSeed='',plannedSwap=null,selectedStrategies=['greedy','lookahead'],simResults=null,simBusy=false,simError='',simFetchStarted=false;
try{const prefs=JSON.parse(localStorage.getItem('spark-setup-v05')||'null');if(prefs){if(SparkEngine.MODES[prefs.mode])selectedMode=prefs.mode;if(Array.isArray(prefs.strategies)&&prefs.strategies.every(s=>['random','greedy','lookahead'].includes(s)))selectedStrategies=prefs.strategies}}catch{}
function rowN(){return replay?.rowSize||game?.rowSize||7}
function rulesLabel(){return replay?.rules||game?.rules||ruleVersion}
function start(bots=1,mode=selectedMode){if(mode==='L'){plannedSwap=null;return legacyStart(bots)}archive();game=SparkEngine.create(bots,mode,selectedSeed!==''?Number(selectedSeed)>>>0:(Date.now()^Math.floor(Math.random()*4294967296))>>>0,selectedStrategies);game.id=Date.now()+'-'+(++archiveCounter);game.uiVersion='0.7';game.feedback='';game.createdAt=new Date().toISOString();choice={kind:'hand',index:0,color:game.players[0].hand[0]};slot=null;plannedSwap=null;replay=null;reviewGame=null;screen='play';playbackPaused=false;save();render();if(typeof window!=='undefined')window.scrollTo({top:0,behavior:'auto'})}
function queueMove(player,move){if(game.version!==5)return legacyQueueMove(player,move);if(game.over||game.pending||player===0&&game.phase!=='human'||player>0&&(game.phase!=='between'||game.nextPlayer!==player)||!SparkEngine.valid(game,player,move))return false;game.pending={player,move:copy(move),before:game.board.slice(),steps:trace(game.board,move),opportunity:SparkEngine.analyze(game,player),cursor:0};game.phase='resolve';plannedSwap=null;delete game.draft;slot=null;save();render();return true}
function nextLabel(){if(game.version!==5)return legacyNextLabel();if(game.phase==='between')return t('הצג את המהלך של ','Show move: ')+who(game.nextPlayer);if(game.phase==='roundEnd')return t('לתור הבא שלי','My next turn');const q=game.pending;if(!q)return '';if(q.cursor===q.steps.length-1)return t('סיים והשלם ל־','Finish and refill to ')+rowN();const next=q.steps[q.cursor+1].kind;return next==='take'?t('קח את קלף הקצה ליד','Take edge card into hand'):next==='discard'?t('הסר את קלף הקצה','Discard edge card'):next==='swap'?t('החלף את הזוג','Swap the pair'):next==='placed'?t('הנח את הקלף','Place the card'):next==='shift'?t('הפעל SHIFT','Activate SHIFT'):next==='match'?t('בדוק התאמה','Check match'):t('אסוף וסגור את השורה','Collect and close the row')}
function explanation(q){const s=q.steps[q.cursor];if(s.kind==='take')return t('אין שלישייה. קלף הקצה הימני עובר ליד השחקן במקום שליפה אקראית.','No triple. The rightmost card goes into the player’s hand instead of a random draw.');if(s.kind==='discard')return t('אין שלישייה. ג׳וקר לא מחליף קלף מהיד ולכן קלף הקצה נזרק כרגיל.','No triple. Wild did not consume a hand card, so the rightmost card is discarded.');if(s.kind==='swap')return t('החלפה היא הכנה להנחה, לא תור נוסף. פותרים רצפים רק לאחר הנחת הקלף.','Swap prepares the placement; it is not another turn. Resolve runs only after the card is placed.');if(s.kind==='shift')return t('SHIFT יצא ללא נקודות. הקלף השמאלי עבר לימין. עכשיו בודקים רצפים שוב.','SHIFT left without points. The leftmost card moved right. Now check runs again.');if(s.kind==='placed')return t('הקלף הונח. כעת יש ','The card was placed. There are now ')+s.board.length+t(' קלפים. עכשיו בודקים רצפים.',' cards. Now check runs.');return legacyExplanation(q)}
function rulesView(compact=false){if(game.version!==5&&!replay?.mode?.match(/^[ABCD]$/))return legacyRulesView(compact);return `<section class="rules ${compact?'compact':''}"><span class="eyebrow">${rulesLabel()} · ${replay?.mode||game.mode} · ${rowN()} ${t('קלפים','cards')}</span><h2>${t('שלושה צבעים. יותר אפשרויות.','Three colors. More choices.')}</h2><ol><li>${t('ביד שלושה קלפים. בחר קלף והנח אותו באחד מ־','Three hand cards. Insert one into any of the ')}${(replay?.mode||game.mode)==='D'?rowN():rowN()+1} ${(replay?.mode||game.mode)==='D'?t('הרווחים שלפני קלפי השורה (לא אחרי האחרון).','gaps before the row cards (not after the final card).'):t('הרווחים, כולל בשני הקצוות.','gaps, including both ends.')}</li><li>${t('רצף של 3 או יותר מאותו צבע נאסף. כל קלף שווה נקודה אחת. סגור את הרווח ובדוק שוב: כך נוצרות שרשראות.','Runs of 3+ matching colors are collected, one point per card. Close the gap and check again for chains.')}</li><li>⇄ <b>SWAP</b> · ${t('פעם במשחק: החלף שני קלפים סמוכים, ואז הנח קלף רגיל באותו תור. רק עכשיו פותרים קומבואים.','Once per game: swap adjacent cards, then place a normal hand card in that same turn. Only then resolve combos.')}</li><li>🌈 <b>WILD</b> · ${t('פעם במשחק: בחר צבע במפורש והנח ג׳וקר במקום קלף מהיד. זו ההנחה היחידה בתור, ולא משלבים אותה עם SWAP.','Once per game: explicitly choose a color and place Wild instead of a hand card. One placement only; it cannot be combined with Swap.')}</li><li>${(replay?.mode||game.mode)==='D'?t('אם הנחת קלף רגיל ולא ניקדת, קלף הקצה הימני נכנס לידך במקום שליפה. אם כן ניקדת, שלוף קלף רגיל; ג׳וקר ללא ניקוד משליך את קלף הקצה.','If a normal card scores nothing, take the rightmost row card into your hand instead of drawing. After scoring, draw normally; Wild without a score still discards the edge card.'):t('אם אין התאמה, הקלף הימני יוצא בלי ניקוד.','Without a match, the rightmost card leaves without points.')} ${t('משלימים את השורה ל־','Refill the row to ')}${rowN()} ${t('קלפים. שמונה תורות לכל שחקן; הניקוד הגבוה מנצח.','cards. Eight turns each; highest score wins.')}</li></ol>${(replay?.mode||game.mode)==='C'?`<div class="rule-special"><b>⇆ SHIFT · ${t('ניסיוני','Experimental')}</b><p>${t('אחד במשחק. אם קומבו צמוד אליו, SHIFT יוצא ללא ניקוד והקלף השמאלי שנותר עובר לקצה הימני. בודקים קומבואים שוב. הוא לא חוזר לקופה ולא נותן נקודות. אם יצא מהקצה בלי קומבו, אינו מופעל.','One per game. If a combo touches it, SHIFT leaves without scoring and the leftmost surviving card moves to the right end. Check combos again. SHIFT is never refilled and never scores. If it leaves the right edge without a combo, it does not activate.')}</p></div>`:''}</section>`}
function setupView(){return `<section class="setup"><h2>${t('בחר מצב למשחק הבא','Choose the next game mode')}</h2><div class="mode-options">${Object.entries(SparkEngine.MODES).map(([id,m])=>`<button data-mode="${id}" aria-pressed="${selectedMode===id}" class="${selectedMode===id?'selected':''}"><b>${id} · ${m.name}</b><span>${m.rowSize} ${t('קלפים בשורה','row cards')}${id==='B'?' · '+t('מומלץ להתחלה','recommended'):id==='C'?' + SHIFT':id==='D'?' · '+t('ניסוי לקיחה מהקצה','edge-card take experiment'):''}</span></button>`).join('')}</div><label>${t('אסטרטגיות הבוטים','Bot strategies')}</label><div class="bot-strategies">${selectedStrategies.map((v,i)=>`<label>BOT ${i+1}<select data-strategy="${i}">${['random','greedy','lookahead'].map(s=>`<option value="${s}" ${v===s?'selected':''}>${s==='random'?t('אקראי','Random'):s==='greedy'?t('חמדן · ניקוד מיידי','Greedy · immediate score'):t('מבט קדימה מוגבל','Limited lookahead')}</option>`).join('')}</select></label>`).join('')}</div><details><summary>${t('בדיקה חוזרת עם אותה פתיחה','Repeat the same opening')}</summary><label for="game-seed">${t('מספר משחק לשחזור (אופציונלי)','Reproducible game number (optional)')}</label><input id="game-seed" type="number" min="0" max="4294967295" step="1" value="${escape(selectedSeed)}"><p class="small">${t('אותו מספר משחזר ידיים וקופה. אפשר להשוות מצבים, אך החלטות שונות יובילו לתוצאות שונות.','The same number reproduces hands and deck. Compare modes; different decisions still lead to different outcomes.')}</p></details><div class="new-options"><button data-start="1">${t('אני ובוט אחד','Me + one bot')}</button><button data-start="2">${t('אני ושני בוטים','Me + two bots')}</button></div><p class="small">${t('המשחק הנוכחי נשמר בארכיון. משחקים ישנים ממשיכים בחוקים המקוריים שלהם.','The current game is archived. Existing saved games continue under their original rules.')}</p></section>`}
function labView(){let html=legacyLabView();html=html.replace(/<div class="new-options">[\s\S]*?<\/div>/,setupView());html=html.replace(t('הארכיון שומר עד 20 משחקים. החוקים נשארים גרסה 0.4; שינויי איזון דורשים גרסה נפרדת.','The archive keeps up to 20 games. Rules remain at version 0.4; balance changes require a separate version.'),t('עד 20 משחקים נשמרים. כל משחק שומר מצב וגרסת חוקים משלו. נתוני סימולציה מוצגים בנפרד מבדיקות אנושיות.','Up to 20 games are kept, each with its own mode and rules version. Simulation is shown separately from human playtests.'));const moves=game.log.flatMap(r=>r.moves||[]),count=moves.length,avg=(key)=>count?moves.reduce((a,m)=>a+(m.opportunity?.[key]||0),0)/count:0;return html.replace('<hr>',`<div class="actual-metrics"><h2>${t('תצפיות מהמשחק הזה','Observed in this game')}</h2><p class="small">${t('כולל מהלכי הבוטים; זו אינה הערכה של כיף או איזון.','Includes bot moves; this does not measure enjoyment or balance.')}</p><p>${count} ${t('תורות','turns')} · ${count?Math.round(moves.filter(m=>!m.score).length/count*100):0}% ${t('ללא ניקוד','zero-point')} · ${avg('scoringMoves').toFixed(1)} ${t('מהלכים מנקדים זמינים בממוצע','scoring moves available on average')} · ${avg('distinctScoring').toFixed(1)} ${t('אפשרויות ניקוד שונות','distinct scoring options')}</p>${game.completedAt?`<p class="small">${t('זמן מקיר לקיר, כולל הפסקות:','Wall-clock duration, including pauses:')} ${Math.round((Date.parse(game.completedAt)-Date.parse(game.createdAt))/1000)}s</p>`:''}</div><hr>`)}
const percent=x=>(x*100).toFixed(1)+'%';
function simulationView(){if(!simFetchStarted&&typeof fetch==='function'){simFetchStarted=true;fetch('simulation-results.json').then(r=>{if(!r.ok)throw Error('Report unavailable');return r.json()}).then(x=>{if(!simResults)simResults=x;if(screen==='sim')render()}).catch(e=>{simError=e.message;if(screen==='sim')render()})}const r=simResults,simModes=['A','B','C',...(r?.modes?.D?['D']:[])];return `<section class="sheet"><span class="eyebrow">${t('סימולציית בוטים · לא בדיקת משתמשים','BOT SIMULATION · NOT HUMAN PLAYTESTING')}</span><h1>${t('משווים תנאים, לא רק ציונים','Compare choices, not just scores')}</h1><p>${t('אותם זרעים, תמהיל אסטרטגיות ומספר תורות בכל מצב. אסטרטגיות אינן רואות קלפים מוסתרים או את הקופה.','Matched seeds, strategy mix and turn counts across modes. Policies cannot inspect hidden hands or the real deck.')}</p><button class="primary full" id="run-simulation" ${simBusy?'disabled':''}>${simBusy?t('מריץ ברקע…','Running in background…'):t('הרץ 30 משחקים חדשים לכל מצב','Run 30 new games per mode')}</button>${simError?`<p class="notice">${escape(simError)}</p>`:''}${r?`<p class="small">${r.conditions.gamesPerMode} ${t('משחקים לכל מצב','games per mode')} · ${r.conditions.seed} seed · 2/3 ${t('שחקנים','players')}</p><div class="comparison-scroll"><table class="comparison"><thead><tr><th>${t('מדד','Metric')}</th><th>A · 8</th><th>B · 9</th><th>C · 9 + SHIFT</th>${r?.modes?.D?'<th>D · Push & Take</th>':''}</tr></thead><tbody>${[[t('תורות ללא נקודות','Zero-point turns'),'zeroRate',percent],[t('מהלכים מנקדים זמינים','Available scoring moves'),'scoringMovesPerTurn',n=>n.toFixed(1)],[t('אפשרויות ניקוד שונות','Distinct scoring options'),'distinctScoringPerTurn',n=>n.toFixed(1)],[t('תורות עם קומבו','Combo turns'),'comboRate',percent],[t('תורות עם שרשרת','Chain turns'),'chainRate',percent],[t('נקודות לתור','Points per turn'),'pointsPerTurn',n=>n.toFixed(2)],[t('מהלכים למשחק','Moves per game'),'averageMovesPerGame',n=>n.toFixed(1)]].map(([label,key,format])=>`<tr><th>${label}</th>${simModes.map(id=>`<td>${format(r.modes[id][key])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><h2>${t('יכולות: שימוש והשפעה','Abilities: usage and impact')}</h2>${['swap','wild'].map(kind=>`<details><summary>${kind.toUpperCase()}</summary>${simModes.map(id=>{const x=r.modes[id].specials[kind];return `<p><b>${id}</b> · ${x.uses} ${t('שימושים','uses')} · ${x.pointsPerUse.toFixed(2)} ${t('נק׳ לשימוש','points/use')} · Δ ${x.counterfactualImpactPerUse.toFixed(2)}</p>`}).join('')}<p class="small">${kind==='swap'?t('Δ ביחס לאותו קלף ומיקום ללא החלפה.','Δ compared with the same card and position without Swap.'):t('Δ ביחס להנחה רגילה מיטבית באותו תור.','Δ compared with the best available regular placement.')}</p></details>`).join('')}<h2>${t('ניצחונות לפי אסטרטגיה','Win share by strategy')}</h2>${['random','greedy','lookahead'].map(strategy=>`<p><b>${strategy}</b> · ${simModes.map(id=>id+': '+percent(r.modes[id].strategies[strategy].winShareRate)).join(' · ')}</p>`).join('')}<p class="small">${t('תיקו מחולק בין הזוכים. ערבוב משחקי שניים ושלושה שחקנים משפיע על שיעור הבסיס.','Ties split a win share. The mix of two- and three-player games affects baseline win rates.')}</p>${r.modes.D?`<p><b>D · Push & Take:</b> ${r.modes.D.takes} ${t('קלפים שנלקחו מהקצה','edge cards taken')} · ${r.modes.D.takesPerGame.toFixed(1)} ${t('למשחק','per game')}</p>`:''}<p>SHIFT: ${r.modes.C.shiftActivations} ${t('הפעלות בסך הכול','total activations')} · ${r.modes.C.shiftPerGame.toFixed(2)} / ${t('משחק','game')}</p><div class="note"><b>${t('איך לקרוא את ההשוואה','How to read this')}</b><p>${t('B הוא נקודת הייחוס לתשעה קלפים. A בודק שמונה קלפים. C בודק SHIFT. D בודק האם לקחת את קלף הקצה ליד בתור ללא ניקוד מוסיף תכנון בלי עוד חוקים מורכבים. ניקוד גבוה יותר לבדו לא מוכיח משחק טוב יותר.','B is the nine-card control. A tests eight cards, C tests SHIFT, and D tests whether taking the rightmost card into your hand on a zero-point regular move enables planning without extra complexity. Higher scoring alone does not establish a better game.')}</p></div><details><summary>${t('תנאי הניסוי והגדרות המדדים','Method and metric definitions')}</summary><p class="small">${escape(r.conditions.fairness)}</p><p class="small">${escape(r.conditions.distinctOptions)}</p><p class="small">${escape(r.conditions.lookahead)}</p><p class="small">${escape(r.conditions.impact)}</p><p class="small">${t('אורך המשחק נמדד במהלכים. זמן ריצה חישובי אינו זמן משחק אנושי. אין להסיק הנאה או קושי מהסימולציה בלבד.','Game length is measured in moves. Compute time is not human play duration. Simulation alone cannot establish enjoyment or learning difficulty.')}</p></details><button id="export-simulation">↓ ${t('ייצא תוצאות סימולציה','Export simulation results')}</button>`:`<p class="muted">${t('טוען דוח השוואה…','Loading the comparison…')}</p>`}</section>`}
function bindExtendedControls(){const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};for(const el of document.querySelectorAll('[data-mode]'))el.onclick=()=>{selectedMode=el.dataset.mode;saveSetup();render()};for(const el of document.querySelectorAll('[data-strategy]'))el.onchange=()=>{selectedStrategies[+el.dataset.strategy]=el.value;saveSetup()};const seedInput=document.getElementById('game-seed');if(seedInput)seedInput.oninput=()=>{const n=Number(seedInput.value);selectedSeed=seedInput.value!==''&&Number.isInteger(n)&&n>=0&&n<=4294967295?seedInput.value:''};bind('cancel-swap',()=>{plannedSwap=null;slot=null;choice={kind:'hand',index:0,color:game.players[0].hand[0]};delete game.draft;save();render()});bind('run-simulation',()=>{if(simBusy)return;simBusy=true;simError='';render();const worker=new Worker('simulation.worker.js');worker.onmessage=e=>{simBusy=false;if(e.data.ok)simResults=e.data.result;else simError=e.data.error;worker.terminate();if(screen==='sim')render()};worker.onerror=()=>{simBusy=false;simError=t('לא ניתן להריץ סימולציה. הדוח הקיים נשאר זמין.','Simulation could not run. The existing report is still available.');worker.terminate();if(screen==='sim')render()};worker.postMessage({gamesPerMode:30,seed:Math.floor(Date.now()/1000)>>>0})});bind('export-simulation',()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(simResults,null,2)],{type:'application/json'}));a.href=url;a.download='spark-simulation-v05.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)})}
function saveSetup(){try{localStorage.setItem('spark-setup-v05',JSON.stringify({mode:selectedMode,strategies:selectedStrategies}))}catch{}}

document.getElementById('language').onclick=()=>{lang=lang==='he'?'en':'he';save();render()};if(load()){plannedSwap=game.draft?.swapPos??null;render()}else start(1);
})();
</script><script src="online.js"></script></body></html>
