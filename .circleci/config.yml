version: 2.1

parameters:
  full_acceptance:
    type: boolean
    default: false

jobs:
  stack-checks:
    parameters:
      full:
        type: boolean
        default: false
    docker:
      - image: cimg/node:24.21.0
    resource_class: medium
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - checkout
      - restore_cache:
          keys:
            - stack-npm-v1-{{ arch }}-{{ checksum "package-lock.json" }}-{{ checksum "apps/web/package-lock.json" }}
            - stack-npm-v1-{{ arch }}-
      - run:
          name: Install locked dependencies
          command: npm run ci:install
      - save_cache:
          key: stack-npm-v1-{{ arch }}-{{ checksum "package-lock.json" }}-{{ checksum "apps/web/package-lock.json" }}
          paths:
            - ~/.npm
      - unless:
          condition: << parameters.full >>
          steps:
            - run:
                name: Run shared fast CI checks
                command: npm run ci:fast
      - when:
          condition: << parameters.full >>
          steps:
            - run:
                name: Run shared full CI core
                command: npm run ci:full-core
            - restore_cache:
                keys:
                  - stack-playwright-shell-{{ arch }}-{{ checksum "scripts/ci.mjs" }}
            - run:
                name: Set up pinned browser runner
                command: npm run ci:browser-setup
            - save_cache:
                key: stack-playwright-shell-{{ arch }}-{{ checksum "scripts/ci.mjs" }}
                paths:
                  - ~/.cache/ms-playwright
            - run:
                name: Run shared browser acceptance
                command: npm run ci:browser-test
            - store_artifacts:
                path: artifacts/browser
                destination: classic-browser
            - store_artifacts:
                path: artifacts/next
                destination: react-browser

workflows:
  stack-fast:
    unless: << pipeline.parameters.full_acceptance >>
    jobs:
      - stack-checks:
          name: stack-fast-checks
          filters:
            branches:
              only: ci/circleci-pilot
  stack-full:
    when: << pipeline.parameters.full_acceptance >>
    jobs:
      - stack-checks:
          name: stack-full-acceptance
          full: true
          filters:
            branches:
              only: ci/circleci-pilot
