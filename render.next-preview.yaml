# Separate opt-in Blueprint. Do NOT replace the existing root render.yaml.
# Import this file manually to create a preview service in your chosen Render workspace.
services:
  - type: web
    name: stack-next-preview
    runtime: node
    branch: feat/nextjs-react-game-table
    plan: free
    autoDeployTrigger: off
    buildCommand: npm install --prefix apps/web --no-audit --no-fund && npm run build --prefix apps/web
    startCommand: npm run start --prefix apps/web -- -p $PORT
    healthCheckPath: /play
    envVars:
      - key: NODE_VERSION
        value: 24.22.3
      - key: NEXT_PUBLIC_STACK_API_ORIGIN
        value: https://stack-card-game-t7vx.onrender.com
