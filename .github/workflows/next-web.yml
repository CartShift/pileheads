name: STACK integrated Render acceptance
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "scripts/render-server.cjs"
      - "scripts/realtime-hub.cjs"
      - "api/**"
      - "scripts/build-integrated.mjs"
      - "scripts/publish-next.mjs"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - "tests/stack-single-service.cjs"
      - "tests/stack-next-browser.cjs"
      - "dist/pilehead/engine.js"
      - ".github/workflows/next-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "scripts/render-server.cjs"
      - "scripts/realtime-hub.cjs"
      - "api/**"
      - "scripts/build-integrated.mjs"
      - "scripts/publish-next.mjs"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - "tests/stack-single-service.cjs"
      - "tests/stack-next-browser.cjs"
      - "dist/pilehead/engine.js"
      - ".github/workflows/next-web.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci --prefix apps/web --no-audit --no-fund
      - run: npm run typecheck --prefix apps/web
      # The same root build command used by the existing Render service.
      # One static export and one Node runtime. Browser API and websocket
      # connections are same-origin: no extra frontend service or CORS.
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node tests/stack-single-service.cjs
      - run: node tests/stack-next-cors.cjs
      - run: npm test
      - name: Cache Playwright Chromium headless shell
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: stack-playwright-1.56.1-headless-${{ runner.os }}
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node tests/stack-next-browser.cjs
      - name: Save React tabletop visual QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stack-next-tabletop-visuals
          path: artifacts/next/
          if-no-files-found: ignore
          retention-days: 7
