name: STACK integrated Render acceptance
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "scripts/render-server.cjs"
      - "scripts/realtime-hub.cjs"
      - "api/**"
      - "scripts/realtime-hub.cjs"
      - "api/**"
      - "scripts/build-integrated.mjs"
      - "scripts/publish-next.mjs"
      - "package.json"
      - "render.yaml"
      - "tests/stack-single-service.cjs"
      - "tests/stack-next-browser.cjs"
      - "dist/pilehead/engine.js"
      - ".github/workflows/next-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "scripts/render-server.cjs"
      - "scripts/publish-next.mjs"
      - "package.json"
      - "render.yaml"
      - "tests/stack-single-service.cjs"
      - "tests/stack-next-browser.cjs"
      - "dist/pilehead/engine.js"
      - ".github/workflows/next-web.yml"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix apps/web --no-audit --no-fund
      - run: npm run typecheck --prefix apps/web
      # The same root build command used by the existing Render service.
      # One static export and one Node runtime. Browser API and websocket
      # connections are same-origin: no extra frontend service or CORS.
      - run: npm install --no-audit --no-fund
      # Temporary review bootstrap: capture resolved lockfiles from a networked CI runner.
      - name: Review lockfile snapshot
        run: |
          python3 - <<'PY'
          import base64
          for label, path in [('root','package-lock.json'),('web','apps/web/package-lock.json')]:
              encoded = base64.b64encode(open(path,'rb').read()).decode('ascii')
              for index, start in enumerate(range(0,len(encoded),2000)):
                  print(f'LOCKFILE_DATA:{label}:{index:04d}:{encoded[start:start+2000]}')
          PY
      - run: npm run build
      - run: node tests/stack-single-service.cjs
      - run: node tests/stack-next-cors.cjs
      - run: npm test
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/stack-next-browser.cjs
      - name: Save React tabletop visual QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stack-next-tabletop-visuals
          path: artifacts/next/
          if-no-files-found: ignore
          retention-days: 7
