name: STACK Next web preview
on:
  push:
    branches: [feat/nextjs-react-game-table]
  pull_request:
    paths:
      - "apps/web/**"
      - "dist/pilehead/engine.js"
      - ".github/workflows/next-web.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix apps/web --no-audit --no-fund
      - run: npm run typecheck --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: npm install --no-audit --no-fund
      - run: node tests/stack-next-cors.cjs
      - run: npm test
