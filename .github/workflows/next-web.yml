name: STACK full acceptance
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/**'
      - 'api/**'
      - 'apps/web/**'
      - 'dist/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'render.yaml'
      - 'vercel.json'
  # Keep verifying direct main pushes while this private repository has no branch protection.
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'api/**'
      - 'apps/web/**'
      - 'dist/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'render.yaml'
      - 'vercel.json'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  full:
    name: STACK full: Classic, React, multiplayer
    # A draft PR gets fast feedback; ready_for_review automatically runs this
    # entire suite. A new commit to a ready PR reruns it against that commit.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 24 and cache both npm lockfiles
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Install locked dependencies once
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix apps/web --no-audit --no-fund
      - name: Typecheck React
        run: npm run typecheck --prefix apps/web
      - name: Build production Classic and React bundle
        run: npm run build
      - name: Run all engine, game rules, API and UI regressions
        run: npm test
      - name: Verify single-origin server and deployment
        run: node tests/stack-single-service.cjs
      - name: Cache pinned Chromium headless shell
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: stack-playwright-1.56.1-headless-${{ runner.os }}
      - name: Install browser runner and headless Chromium once
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Exercise Classic desktop/mobile browser and live multiplayer
        run: |
          node tests/pilehead-browser.cjs
          node tests/pilehead-live-browser.cjs
      - name: Exercise React desktop/mobile browser and live multiplayer
        run: node tests/stack-next-browser.cjs
      - name: Save Classic browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stack-classic-browser-failure
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save React tabletop screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stack-next-tabletop-visuals
          path: artifacts/next/
          if-no-files-found: ignore
          retention-days: 7
