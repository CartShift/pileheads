name: STACK Next web preview
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "scripts/render-server.cjs"
      - "scripts/publish-next.mjs"
      - "package.json"
      - "render.yaml"
      - "tests/stack-single-service.cjs"
      - "tests/stack-next-browser.cjs"
      - "dist/pilehead/engine.js"
      - ".github/workflows/next-web.yml"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix apps/web --no-audit --no-fund
      - run: npm run typecheck --prefix apps/web
      # CI-only backend endpoint baked into Next's public client bundle.
      # One static export and one Node runtime. Browser API and websocket
      # connections are same-origin: no extra frontend service or CORS.
      - run: npm install --no-audit --no-fund
      - run: npm run build:integrated
      - run: node tests/stack-single-service.cjs
      - run: node tests/stack-next-cors.cjs
      - run: npm test
      - run: node tests/stack-next-simulator-stress.cjs
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/stack-next-browser.cjs
      - name: Save React tabletop visual QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stack-next-tabletop-visuals
          path: artifacts/next/
          if-no-files-found: ignore
          retention-days: 7
