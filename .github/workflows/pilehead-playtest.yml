name: STACK fast checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/**'
      - 'api/**'
      - 'apps/web/**'
      - 'dist/**'
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'render.yaml'
      - 'vercel.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'api/**'
      - 'apps/web/**'
      - 'dist/**'
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'render.yaml'
      - 'vercel.json'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: 'STACK fast: engine, API, types and Classic'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 24 and cache both npm lockfiles
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix apps/web --no-audit --no-fund
      - name: Verify React types (without a production build)
        run: npm run typecheck --prefix apps/web
      - name: Run deterministic engine, API, UI and rules regression tests
        run: npm test
      - name: Build only the Classic static bundle
        run: npm run build:classic
      - name: Verify Classic publish boundaries
        run: |
          test -f vercel-static/index.html
          test -f vercel-static/pilehead/index.html
          test -f vercel-static/pilehead/assets/stack-sheet.webp
          test ! -e vercel-static/tilt
          test ! -e vercel-static/engine-v5.js
