name: STACK regression gates
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'api/**'
      - 'dist/**'
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'package-lock.json'
      - 'README.md'
      - 'vercel.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'api/**'
      - 'dist/**'
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'README.md'
      - 'vercel.json'
permissions:
  contents: read
jobs:
  test:
    name: STACK engine, room API, UI, art and build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run STACK regression suite
        run: npm test
      - name: Build static bundle
        run: npm run build
      - name: Verify only STACK is published
        run: |
          test -f vercel-static/index.html
          test -f vercel-static/pilehead/index.html
          test -f vercel-static/pilehead/assets/stack-sheet.webp
          test ! -e vercel-static/tilt
          test ! -e vercel-static/engine-v5.js
