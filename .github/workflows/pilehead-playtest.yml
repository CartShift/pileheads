name: PILEHEAD playtest gates
on:
  pull_request:
    paths:
      - '.github/workflows/pilehead-playtest.yml'
      - 'dist/pilehead/**'
      - 'docs/pilehead*'
      - 'tests/pilehead*'
      - 'scripts/build*.mjs'
      - 'package.json'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pilehead-playtest.yml'
      - 'dist/pilehead/**'
      - 'docs/pilehead*'
      - 'tests/pilehead*'
      - 'scripts/build*.mjs'
      - 'package.json'
      - 'README.md'
permissions:
  contents: read
jobs:
  playtest:
    name: Rules, API, UI contracts and static bundles
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # Scope this workflow to PILEHEAD: unrelated legacy SPARK parity tests
      # currently fail against the modified SPARK UI and need separate repair.
      # PILEHEAD tests use built-in Node modules and a mocked Neon API.
      - name: Run every PILEHEAD regression (engine, online, UI and playtest)
        run: |
          set -euo pipefail
          for file in tests/pilehead-*.cjs; do
            node "$file"
          done
      - name: Build static Vercel app
        run: npm run build:vercel
      - name: Build Sites/Worker bundle
        run: npm run build
