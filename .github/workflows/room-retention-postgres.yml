name: Room retention PostgreSQL acceptance
on:
  pull_request:
    paths:
      - 'db/room-*.sql'
      - 'scripts/room-retention.cjs'
      - 'scripts/room-lifecycle.cjs'
      - 'scripts/round-receipts.cjs'
      - 'scripts/private-history.cjs'
      - 'scripts/matchmaking-queue.cjs'
      - 'tests/pilehead-matchmaking-queue.cjs'
      - 'tests/pilehead-private-history.cjs'
      - 'db/player-accounts-v1.sql'
      - 'tests/pilehead-round-receipts.cjs'
      - 'tests/pilehead-room-retention.cjs'
      - '.github/workflows/room-retention-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: room-retention-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          # Disposable service only; no host ports, deployment secrets or production data.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify actual SQL, least privilege and bounded expiry-only deletion
        env:
          PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node <<'NODE'
          'use strict';
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const {spawnSync} = require('node:child_process');
          const {runRetention} = require('./scripts/room-retention.cjs');
          const {CREATE_ROOM_SQL,JOIN_ROOM_SQL}=require('./scripts/room-lifecycle.cjs');
          const {ARCHIVE_ROUND_SQL}=require('./scripts/round-receipts.cjs');
          const H=require('./scripts/private-history.cjs');
          const Q=require('./scripts/matchmaking-queue.cjs');
          const id = process.env.PG_TEST_CONTAINER;
          assert.match(id || '', /^[a-f0-9]{12,64}$/);
          function psql(sql, role) {
            const input = (role ? 'SET ROLE ' + role + ';\n' : '') + sql + '\n';
            const p = spawnSync('docker', ['exec','-i',id,'psql','-X','-qAt','-F','\t','-v','ON_ERROR_STOP=1','-U','postgres','-d','postgres'], {
              input, encoding:'utf8', timeout:30000
            });
            if (p.error) throw p.error;
            if (p.status !== 0) throw new Error(p.stderr || 'isolated PostgreSQL failure');
            return p.stdout.trim();
          }
          function count(table, where='true') {
            return Number(psql('SELECT count(*) FROM public.' + table + ' WHERE ' + where + ';'));
          }
          async function main() {
            psql(fs.readFileSync('db/room-schema-development.sql','utf8'));
            psql('DROP INDEX public.pilehead_rate_limits_expire;');
            psql(fs.readFileSync('db/room-retention-index.sql','utf8'));
            assert.equal(psql("SELECT indisvalid FROM pg_index WHERE indexrelid='public.pilehead_rate_limits_expire'::regclass;"), 't');
            psql(fs.readFileSync('db/room-access-roles.sql','utf8'));
            const runtime = 'pileheads_runtime_access';
            const maintenance = 'pileheads_maintenance_access';
            psql("INSERT INTO public.pilehead_rooms(code,capacity,status,state,expires_at) SELECT 'E'||lpad(n::text,7,'0'),2,'finished','{}'::jsonb,now()-interval '1 day' FROM generate_series(1,501) n;");
            psql("INSERT INTO public.pilehead_members(code,seat,display_name,token_hash) SELECT code,0,'Synthetic','token-'||code FROM public.pilehead_rooms;");
            psql("INSERT INTO public.pilehead_rate_limits(bucket,expires_at) SELECT 'expired-'||n,now()-interval '1 day' FROM generate_series(1,501) n;");
            psql("INSERT INTO public.pilehead_rooms(code,capacity,status,state,expires_at) VALUES('ACTIVE01',2,'lobby','{}',now()+interval '1 day'); INSERT INTO public.pilehead_members(code,seat,display_name,token_hash) VALUES('ACTIVE01',0,'Synthetic','active-token'); INSERT INTO public.pilehead_rate_limits(bucket,expires_at) VALUES('active',now()+interval '1 day');", runtime);
            psql("UPDATE public.pilehead_rooms SET revision=revision+1 WHERE code='ACTIVE01'; UPDATE public.pilehead_members SET is_away=true WHERE code='ACTIVE01'; UPDATE public.pilehead_rate_limits SET hits=hits+1 WHERE bucket='active';", runtime);
            assert.equal(psql("SELECT revision FROM public.pilehead_rooms WHERE code='ACTIVE01';",runtime),'1');
            assert.throws(()=>psql("DELETE FROM public.pilehead_rooms WHERE code='ACTIVE01';",runtime),/permission denied/i);
            assert.throws(()=>psql("UPDATE public.pilehead_rooms SET revision=99 WHERE code='ACTIVE01';",maintenance),/permission denied/i);
            assert.throws(()=>psql("INSERT INTO public.pilehead_rate_limits(bucket,expires_at) VALUES('forbidden',now());",maintenance),/permission denied/i);
            const logs=[];
            const log=s=>logs.push(JSON.parse(s));
            const query=async (sql, params)=>{
              assert.deepEqual(params,[]);
              const values=psql(sql+';',maintenance).split('\t');
              if(sql.startsWith('SELECT')) return [{expired_rooms:values[0],expired_buckets:values[1]}];
              return [{deleted:values[0]}];
            };
            await runRetention({query,log});
            assert.deepEqual(logs[0],{mode:'dry-run',expired_rooms:'501',expired_buckets:'501'});
            assert.equal(count('pilehead_rooms'),502);
            assert.equal(count('pilehead_members'),502);
            assert.equal(count('pilehead_rate_limits'),502);
            await runRetention({query,args:['--apply'],log});
            assert.deepEqual(logs[2],{deletedRooms:'500',deletedBuckets:'500'});
            assert.equal(count('pilehead_rooms'),2);
            assert.equal(count('pilehead_members'),2);
            assert.equal(count('pilehead_rate_limits'),2);
            await runRetention({query,args:['--apply'],log});
            assert.deepEqual(logs[4],{deletedRooms:'1',deletedBuckets:'1'});
            assert.equal(count('pilehead_rooms',"code='ACTIVE01'"),1);
            assert.equal(count('pilehead_members',"code='ACTIVE01'"),1);
            assert.equal(count('pilehead_rate_limits',"bucket='active'"),1);
            assert.equal(count('pilehead_rooms'),1);
            assert.equal(count('pilehead_members'),1);
            assert.equal(count('pilehead_rate_limits'),1);
            await runRetention({query,args:['--apply'],log});
            assert.deepEqual(logs[6],{deletedRooms:'0',deletedBuckets:'0'});
            // Exercise the exact parameterized statements on a disposable DB,
            // not approximations of the production SQL or a live database.
            const create=(code,token)=>psql("PREPARE c AS "+CREATE_ROOM_SQL+"; EXECUTE c('"+code+"',2,'{}','Host','"+token+"');",runtime);
            const join=(code,token)=>psql("PREPARE j AS "+JOIN_ROOM_SQL+"; EXECUTE j('"+code+"','Friend','"+token+"',2);",runtime);
            assert.ok(create('LIFE0001','host-one').startsWith('LIFE0001'));
            assert.equal(count('pilehead_members',"code='LIFE0001' AND seat=0"),1);
            // Host token conflict must roll back the room insert as well.
            assert.throws(()=>create('LIFE0002','host-one'),/duplicate key/i);
            assert.equal(count('pilehead_rooms',"code='LIFE0002'"),0);
            assert.equal(count('pilehead_members',"code='LIFE0002'"),0);
            assert.ok(join('LIFE0001','friend-one').startsWith('LIFE0001'));
            assert.equal(join('LIFE0001','friend-two'),'');
            assert.equal(count('pilehead_members',"code='LIFE0001'"),2);
            create('LIFE0003','host-three');
            psql("UPDATE public.pilehead_rooms SET status='finished' WHERE code='LIFE0003';",runtime);
            assert.equal(join('LIFE0003','late-friend'),'');
            create('LIFE0004','host-four');
            psql("UPDATE public.pilehead_rooms SET expires_at=now()-interval '1 hour' WHERE code='LIFE0004';",runtime);
            assert.equal(join('LIFE0004','expired-friend'),'');
            assert.equal(count('pilehead_members',"code IN ('LIFE0003','LIFE0004')"),2);
            console.log('PASS exact lifecycle SQL: atomic creation, rollback, capacity, terminal and expired join guards');
            psql(fs.readFileSync('db/room-round-receipts.sql','utf8'));
            psql("GRANT INSERT ON public.pileheads_round_receipts TO "+runtime+"; GRANT SELECT(room_instance_id) ON public.pileheads_round_receipts TO "+runtime+";");
            const roomId='c7fc5012-3ee3-4f2c-8d35-fd9c71ebcfa7';
            const archive=(code,rev,placements)=>psql("PREPARE a AS "+ARCHIVE_ROUND_SQL+"; EXECUTE a('{}','finished','"+code+"',"+rev+",'"+roomId+"',1,'pilehead-1.7.0','classic',3,2,2,'"+placements+"',45);",runtime);
            create('LIFE0005','host-five');
            assert.equal(archive('LIFE0005',99,'{1,2}'),'');
            assert.equal(count('pileheads_round_receipts'),0);
            assert.throws(()=>archive('LIFE0005',0,'{1,1}'),/check constraint/i);
            assert.equal(psql("SELECT revision FROM pilehead_rooms WHERE code='LIFE0005';"),'0');
            assert.ok(archive('LIFE0005',0,'{1,2}').startsWith('LIFE0005'));
            assert.equal(count('pileheads_round_receipts'),1);
            assert.equal(archive('LIFE0005',0,'{1,2}'),'');
            create('LIFE0006','host-six');
            assert.throws(()=>archive('LIFE0006',0,'{1,2}'),/duplicate key/i);
            assert.equal(psql("SELECT revision FROM pilehead_rooms WHERE code='LIFE0006';"),'0');
            assert.equal(count('pileheads_round_receipts'),1);
            assert.throws(()=>psql("DELETE FROM pileheads_round_receipts;",runtime),/permission denied/i);
            console.log('PASS exact receipt SQL: CAS, constraint/duplicate rollback, least privilege and exactly one receipt');
            psql(fs.readFileSync('db/player-accounts-v1.sql','utf8'));
            psql(fs.readFileSync('db/room-private-history.sql','utf8'));
            psql("GRANT SELECT(token_hash,account_id,expires_at) ON pileheads_account_sessions TO "+runtime+"; GRANT SELECT,INSERT,DELETE ON pileheads_round_consents TO "+runtime+"; GRANT INSERT,SELECT(seat) ON pileheads_player_rounds TO "+runtime+";");
            const aid='1c0c6815-e56b-4e6f-a6e3-1b3345c9b986',bid='2c0c6815-e56b-4e6f-a6e3-1b3345c9b986';
            const a='a'.repeat(64),b='b'.repeat(64),c='c'.repeat(64);
            const rid='b7fc5012-3ee3-4f2c-8d35-fd9c71ebcfa7';
            psql("INSERT INTO pileheads_accounts(id,provider,provider_subject) VALUES('"+aid+"','google','synthetic-a'),('"+bid+"','google','synthetic-b'); INSERT INTO pileheads_account_sessions(token_hash,account_id) VALUES('"+a+"','"+aid+"'),('"+b+"','"+bid+"'),('"+c+"','"+aid+"');");
            create('HIST0001','history-host');join('HIST0001','history-friend');
            const state=JSON.stringify({phase:'setup',round:1,roomInstanceId:rid});
            psql("UPDATE pilehead_rooms SET state='"+state+"' WHERE code='HIST0001';",runtime);
            const consent=(stmt,member,session,rev,round=1)=>psql("PREPARE consent AS "+stmt+"; EXECUTE consent('HIST0001','"+member+"','"+session+"',"+round+","+rev+");",runtime);
            const status=(member,session)=>psql("PREPARE status AS "+H.SQL.status+"; EXECUTE status('HIST0001','"+member+"','"+session+"',1);",runtime);
            assert.equal(status('history-host',a),'t\tf');
            assert.equal(consent(H.SQL.link,'forged-seat',a,0),'');
            assert.equal(consent(H.SQL.link,'history-host','x'.repeat(64),0),'');
            assert.equal(consent(H.SQL.link,'history-host',a,0,2),'');
            assert.equal(consent(H.SQL.link,'history-host',a,0),'HIST0001');
            assert.equal(status('history-host',c),'t\tt','same account on another device');
            assert.equal(status('history-host',b),'t\tf','other account cannot see consent');
            assert.equal(consent(H.SQL.link,'history-friend',a,1),'','one account per round');
            assert.equal(consent(H.SQL.link,'history-host',b,1),'','one account per seat');
            assert.equal(consent(H.SQL.link,'history-friend',b,1),'HIST0001');
            assert.equal(consent(H.SQL.unlink,'history-host',b,2),'');
            psql("UPDATE pilehead_rooms SET state=jsonb_set(state,'{phase}','\"play\"'),status='playing' WHERE code='HIST0001';",runtime);
            assert.equal(consent(H.SQL.link,'history-host',a,2),'');
            assert.equal(consent(H.SQL.unlink,'history-friend',b,2),'HIST0001');
            assert.equal(count('pileheads_round_consents'),1);
            const archivePersonal=rev=>psql("PREPARE pa AS "+H.SQL.archive+"; EXECUTE pa('{}','finished','HIST0001',"+rev+",'"+rid+"',1,'pilehead-1.7.0','classic',3,2,2,'{1,2}',45);",runtime);
            assert.equal(archivePersonal(2),'');assert.equal(count('pileheads_player_rounds'),0);
            assert.ok(archivePersonal(3).startsWith('HIST0001'));
            assert.equal(count('pileheads_player_rounds'),1);
            assert.equal(archivePersonal(3),'');assert.equal(count('pileheads_player_rounds'),1);
            const list=session=>psql("PREPARE history AS "+H.SQL.list+"; EXECUTE history('"+session+"');");
            assert.ok(list(c).includes('pilehead-1.7.0'));assert.equal(list(b),'');
            psql("DELETE FROM pilehead_rooms WHERE code='HIST0001';",maintenance);
            assert.equal(count('pileheads_round_consents'),0);assert.equal(count('pileheads_player_rounds'),1);
            psql("DELETE FROM pileheads_accounts WHERE id='"+aid+"';");
            assert.equal(count('pileheads_player_rounds'),0);assert.equal(count('pileheads_round_receipts',"room_instance_id='"+rid+"'"),1);
            assert.throws(()=>psql("SELECT provider_subject FROM pileheads_accounts;",runtime),/permission denied/i);
            console.log('PASS exact private history SQL: dual credentials, seat/account isolation, consent withdrawal, CAS, durable history and deletion cascades');
            psql(fs.readFileSync('db/room-matchmaking-queue.sql','utf8'));
            psql("GRANT SELECT,INSERT,UPDATE,DELETE ON pileheads_queue_tickets,pileheads_match_offers TO "+runtime+"; GRANT SELECT ON pileheads_match_blocks TO "+runtime+";");
            const ids=Array.from({length:6},(_,i)=>'4c0c6815-e56b-4e6f-a6e3-'+String(i+1).padStart(12,'0'));
            const keys=ids.map((_,i)=>String(i+1).repeat(64));
            const tid=i=>'5c0c6815-e56b-4e6f-a6e3-'+String(i+1).padStart(12,'0');
            const oid=i=>'6c0c6815-e56b-4e6f-a6e3-'+String(i+1).padStart(12,'0');
            for(let i=0;i<ids.length;i++)psql("INSERT INTO pileheads_accounts(id,provider,provider_subject) VALUES('"+ids[i]+"','google','queue-"+i+"'); INSERT INTO pileheads_account_sessions(token_hash,account_id) VALUES('"+keys[i]+"','"+ids[i]+"');");
            const qrun=(sql,args)=>psql("PREPARE queue_action AS "+sql+"; EXECUTE queue_action("+args.map(x=>"'"+x+"'").join(',')+");",runtime);
            assert.equal(qrun(Q.SQL.join,['0'.repeat(64),tid(0)]),'');
            assert.equal(qrun(Q.SQL.join,[keys[0],tid(0)]),tid(0));
            assert.equal(qrun(Q.SQL.join,[keys[0],tid(1)]),'','duplicate identity');
            assert.equal(qrun(Q.SQL.claim,[oid(0)]),'0','no fake opponent');
            assert.equal(qrun(Q.SQL.join,[keys[1],tid(1)]),tid(1));
            psql("INSERT INTO pileheads_match_blocks(account_id,blocked_account_id) VALUES('"+ids[1]+"','"+ids[0]+"');");
            assert.equal(qrun(Q.SQL.claim,[oid(0)]),'0','block works both directions');
            assert.equal(qrun(Q.SQL.join,[keys[2],tid(2)]),tid(2));
            assert.equal(qrun(Q.SQL.claim,[oid(0)]),'2');
            assert.equal(count('pileheads_match_offers'),1);assert.equal(count('pileheads_queue_tickets','offer_id IS NOT NULL'),2);
            assert.equal(qrun(Q.SQL.accept,[keys[1],oid(0)]),'','outsider cannot accept');
            assert.equal(qrun(Q.SQL.accept,[keys[0],oid(0)]),'f');assert.equal(qrun(Q.SQL.accept,[keys[0],oid(0)]),'f');
            assert.equal(qrun(Q.SQL.accept,[keys[2],oid(0)]),'t');
            assert.equal(qrun(Q.SQL.cancelOffer,[keys[1],oid(0)]),'');
            assert.equal(qrun(Q.SQL.cancelWaiting,[keys[0],tid(0)]),'','cannot cancel a paired ticket alone');
            assert.equal(qrun(Q.SQL.cancelOffer,[keys[0],oid(0)]),oid(0));
            assert.equal(count('pileheads_queue_tickets'),1,'both paired tickets removed');
            for(let i=3;i<6;i++)assert.equal(qrun(Q.SQL.join,[keys[i],tid(i)]),tid(i));
            // Independent connections race to claim. Each account can occur in only one offer.
            const {spawn}=require('node:child_process');
            const claimConcurrent=id=>new Promise((resolve,reject)=>{
              const child=spawn('docker',['exec','-i',process.env.PG_TEST_CONTAINER,'psql','-X','-qAt','-v','ON_ERROR_STOP=1','-U','postgres','-d','postgres']);
              let out='',err='';child.stdout.on('data',d=>out+=d);child.stderr.on('data',d=>err+=d);
              child.on('error',reject);child.on('close',code=>code===0?resolve(Number(out.trim())):reject(Error(err)));
              child.stdin.end('SET ROLE '+runtime+"; PREPARE claim AS "+Q.SQL.claim+"; EXECUTE claim('"+id+"');");
            });
            // Use the same database selected by the existing psql helper.
            const results=await Promise.all([claimConcurrent(oid(1)),claimConcurrent(oid(2))]);
            assert.ok(results.every(n=>n===0||n===2));
            if(count('pileheads_queue_tickets','offer_id IS NULL')===2)assert.equal(qrun(Q.SQL.claim,[oid(3)]),'2');
            assert.equal(count('pileheads_queue_tickets','offer_id IS NOT NULL'),4);
            assert.equal(count('pileheads_match_offers'),2);
            assert.equal(psql("SELECT count(*) FROM (SELECT account_a AS a FROM pileheads_match_offers UNION ALL SELECT account_b FROM pileheads_match_offers) t GROUP BY a HAVING count(*)>1;"),'');
            psql("UPDATE pileheads_match_offers SET created_at=now()-interval '2 minutes',expires_at=now()-interval '1 minute';");
            assert.equal(qrun(Q.SQL.accept,[keys[1],oid(1)]),'');
            assert.equal(psql(Q.SQL.expireOffers+';',runtime),'2');
            assert.equal(count('pileheads_queue_tickets'),0);
            assert.equal(qrun(Q.SQL.join,[keys[0],tid(0)]),tid(0));
            psql("UPDATE pileheads_queue_tickets SET joined_at=now()-interval '10 minutes',expires_at=now()-interval '1 minute';");
            assert.equal(psql(Q.SQL.expireWaiting+';',runtime),'1');
            assert.equal(count('pileheads_queue_tickets'),0);
            console.log('PASS exact matchmaking queue SQL: authentication, blocks, concurrent claims, ready check, cancellation and expiry');

            console.log('PASS isolated PostgreSQL: role grants, valid expiry index, dry run, 500-row batches, cascades, active records and idempotent cleanup');
          }
          main().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
