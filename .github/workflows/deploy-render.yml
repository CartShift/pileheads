name: Deploy STACK to Render

# Render currently watches a dedicated branch. Mirror production main into it
# until the service is switched directly to main in Render's dashboard.
on:
  push:
    branches: [main]
    # Do not redeploy Render for documentation, tests or CI-only updates.
    paths:
      - 'api/**'
      - 'packages/**'
      - 'scripts/sync-game-engine.cjs'
      - 'apps/web/**'
      - 'dist/**'
      - 'scripts/build-integrated.mjs'
      - 'scripts/build-vercel.mjs'
      - 'scripts/publish-next.mjs'
      - 'scripts/realtime-hub.cjs'
      - 'scripts/render-server.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'render.yaml'

concurrency:
  group: stack-render-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-render:
    name: Sync production commit to Render
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 10
    steps:
      - name: Checkout release manifest and smoke script
        uses: actions/checkout@v4
      - name: Fast-forward Render deployment branch
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_BRANCH: feat/render-hosting-outage-fallback-20261120
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${RENDER_BRANCH}" \
            -f sha="${GITHUB_SHA}" -F force=false

      # Render deploys asynchronously once its watched branch advances.
      # A successful branch mirror does NOT prove the live web service is
      # running the new revision, connected to Neon or serving both tables.
      - name: Verify live Render SHA, Neon readiness, Classic and React
        env:
          STACK_RENDER_URL: https://stack-card-game-t7vx.onrender.com
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/check-render-production.mjs
