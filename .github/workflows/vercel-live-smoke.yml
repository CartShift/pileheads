name: Vercel live multiplayer acceptance
on:
  workflow_dispatch:
    inputs:
      move_samples:
        description: 'Number of sequential moves in one disposable room'
        type: choice
        options: ['1', '20']
        default: '1'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  live-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'deploy/vercel-restore-20261126')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Verify canonical domain with two authenticated players
        env:
          SMOKE_MOVE_SAMPLES: ${{ inputs.move_samples || '1' }}
        run: node scripts/smoke-live.cjs https://pileheads.com
