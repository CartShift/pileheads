name: Security baseline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '24 5 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  secret-history:
    name: Secret scan (reachable history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 2 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan all fetched branches and tags without publishing findings
        shell: bash
        run: |
          set -euo pipefail
          report=$(mktemp)
          trap 'rm -f "$report"' EXIT
          if "$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact=100 --no-banner . >"$report" 2>&1; then
            echo "Secret history scan passed."
          else
            echo "::error::Secret scan failed or found a potential credential. Inspect privately; never attach scanner reports to this public repository."
            exit 1
          fi
  dependency-audit:
    name: Dependency audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', 'apps/web']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Audit locked dependencies without installing packages
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=high --ignore-scripts --registry=https://registry.npmjs.org
