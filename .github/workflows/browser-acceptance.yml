name: STACK browser acceptance
on:
  pull_request:
    paths:
      - 'api/**'
      - 'dist/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'package.json'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install game and pinned Chromium acceptance runner
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build and exercise the physical tabletop
        run: |
          npm run build
          node tests/pilehead-browser.cjs
      - name: Save screenshot when browser QA fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stack-browser-failure
          path: artifacts/browser/
          if-no-files-found: ignore
