services:
  - type: web
    name: stack-card-game
    runtime: node
    branch: main
    autoDeployTrigger: commit
    plan: free
    buildCommand: npm install --no-audit --no-fund && npm install --prefix apps/web --no-audit --no-fund && npm run build:integrated
    startCommand: node scripts/render-server.cjs
    healthCheckPath: /livez
    envVars:
      - key: PILEHEAD_DATABASE_URL
        sync: false
